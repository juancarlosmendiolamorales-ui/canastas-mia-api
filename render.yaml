# Configuración para Render (https://render.com). Plan gratis.
services:
  - type: web
    name: canastas-mia-api
    runtime: node
    plan: free
    region: virginia # cerca de la base de datos de Neon (US East)
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # se pega a mano en Render: es secreta
      - key: CORS_ORIGENES
        value: https://canastas-mia.onrender.com # el catálogo
