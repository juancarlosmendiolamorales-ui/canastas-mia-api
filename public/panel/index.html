<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Canastas MIA</title>
<style>
  :root {
    --vino: #7a1219; --vino-osc: #5c0d13; --crema: #f6ecdc; --oro: #b8862d;
    --texto: #2a1a17; --suave: #6b5a55; --borde: #e3d5c0; --blanco: #fff;
    --nuevo: #2563eb; --pagado: #0f766e; --en_preparacion: #b45309; --entregado: #15803d; --cancelado: #6b7280;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--crema); color: var(--texto); }
  button, select, input { font: inherit; }
  h1, h2 { font-family: Georgia, "Times New Roman", serif; margin: 0; }
  [hidden] { display: none !important; }

  /* Login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login form { background: var(--blanco); border: 1px solid var(--borde); border-radius: 14px; padding: 28px 22px; width: 100%; max-width: 360px; }
  .login h1 { color: var(--vino); font-size: 28px; text-align: center; }
  .login p.sub { text-align: center; color: var(--suave); margin: 4px 0 20px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 14px; }
  label input { display: block; width: 100%; margin-top: 6px; padding: 11px 12px; border: 1px solid var(--borde); border-radius: 8px; background: var(--blanco); }
  .btn { border: 0; border-radius: 8px; padding: 11px 16px; font-weight: 600; cursor: pointer; }
  .btn-principal { background: var(--vino); color: var(--blanco); width: 100%; }
  .btn-principal:hover { background: var(--vino-osc); }
  .btn-claro { background: transparent; color: var(--blanco); border: 1px solid rgba(255,255,255,.5); padding: 7px 12px; }
  .error { color: #b91c1c; font-size: 14px; min-height: 20px; margin: 0 0 10px; }

  /* Panel */
  header { background: var(--vino); color: var(--blanco); padding: 14px 16px; position: sticky; top: 0; z-index: 2; }
  .barra { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .barra h1 { font-size: 22px; flex: 1; min-width: 160px; }
  .barra .hola { font-size: 14px; opacity: .9; width: 100%; order: 3; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  .filtros { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
  .filtros button { flex: none; background: var(--blanco); border: 1px solid var(--borde); border-radius: 999px; padding: 7px 14px; cursor: pointer; color: var(--texto); }
  .filtros button[aria-pressed="true"] { background: var(--vino); border-color: var(--vino); color: var(--blanco); }
  .filtros .n { opacity: .7; margin-left: 4px; }
  .acciones { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: var(--suave); font-size: 14px; }
  .acciones button { background: none; border: 0; color: var(--vino); font-weight: 600; cursor: pointer; padding: 6px 0; }
  .lista { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
  .pedido { background: var(--blanco); border: 1px solid var(--borde); border-left: 5px solid var(--color, var(--borde)); border-radius: 10px; padding: 14px 16px; }
  .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .codigo { font-family: ui-monospace, Menlo, monospace; font-weight: 700; }
  .fecha { color: var(--suave); font-size: 13px; }
  .cliente { font-weight: 600; margin: 8px 0 2px; }
  .contacto { font-size: 14px; color: var(--suave); }
  .contacto a { color: #15803d; font-weight: 600; text-decoration: none; }
  .pedido ul { margin: 10px 0; padding-left: 18px; }
  .nota { background: var(--crema); border-radius: 6px; padding: 6px 10px; font-size: 14px; margin: 8px 0; }
  .pie { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .total { font-weight: 700; color: var(--vino); }
  .total.sin { font-weight: 400; color: var(--suave); font-style: italic; }
  .pie select { padding: 8px 10px; border: 1px solid var(--borde); border-radius: 8px; background: var(--blanco); font-weight: 600; color: var(--color); }
  .vacio { text-align: center; color: var(--suave); padding: 40px 16px; }

  dialog { border: 0; border-radius: 14px; padding: 22px; width: min(92vw, 380px); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h2 { color: var(--vino); margin-bottom: 14px; font-size: 22px; }
  .fila-botones { display: flex; gap: 8px; }
  .fila-botones .btn { flex: 1; }
  .btn-gris { background: #eee; color: var(--texto); }
  .aviso { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--texto); color: var(--blanco); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 5; max-width: calc(100vw - 32px); }
  @media (min-width: 640px) { .barra .hola { width: auto; order: 0; } }

  /* Pestañas Pedidos / Reclamos */
  .pestanas { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 2px solid var(--borde); }
  .pestanas button { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 10px 14px; font-weight: 600; color: var(--suave); cursor: pointer; }
  .pestanas button[aria-selected="true"] { color: var(--vino); border-bottom-color: var(--vino); }
  .pestanas .alerta { background: #b91c1c; color: var(--blanco); border-radius: 999px; padding: 0 7px; font-size: 12px; margin-left: 4px; }
  .reclamo { background: var(--blanco); border: 1px solid var(--borde); border-left: 5px solid var(--color); border-radius: 10px; padding: 14px 16px; }
  .reclamo dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 10px 0; font-size: 14px; }
  .reclamo dt { color: var(--suave); }
  .reclamo dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .plazo { font-size: 14px; font-weight: 600; color: var(--color); }
  .reclamo .botones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .reclamo .botones a, .reclamo .botones button { flex: 1 1 160px; text-align: center; text-decoration: none; font-size: 14px; }
  .btn-borde { background: var(--blanco); color: var(--vino); border: 1px solid var(--vino); }
  textarea { display: block; width: 100%; margin-top: 6px; padding: 10px 12px; border: 1px solid var(--borde); border-radius: 8px; font: inherit; resize: vertical; }
</style>
</head>
<body>

<section class="login" id="vista-login" hidden>
  <form id="form-login">
    <h1>Canastas MIA</h1>
    <p class="sub">Panel de pedidos</p>
    <label>Usuario<input id="l-usuario" autocomplete="username" required autocapitalize="none"></label>
    <label>Contraseña<input id="l-clave" type="password" autocomplete="current-password" required></label>
    <p class="error" id="l-error" role="alert"></p>
    <button class="btn btn-principal" type="submit">Entrar</button>
  </form>
</section>

<div id="vista-panel" hidden>
  <header>
    <div class="barra">
      <h1>Canastas MIA</h1>
      <span class="hola" id="hola"></span>
      <button class="btn btn-claro" id="btn-clave" type="button">Contraseña</button>
      <button class="btn btn-claro" id="btn-salir" type="button">Salir</button>
    </div>
  </header>
  <main>
    <div class="pestanas" role="tablist">
      <button type="button" role="tab" id="tab-pedidos" aria-selected="true" aria-controls="sec-pedidos">Pedidos</button>
      <button type="button" role="tab" id="tab-reclamos" aria-selected="false" aria-controls="sec-reclamos">Reclamos <span class="alerta" id="n-reclamos" hidden></span></button>
    </div>
    <section id="sec-pedidos" role="tabpanel" aria-labelledby="tab-pedidos">
    <div class="filtros" id="filtros" role="group" aria-label="Filtrar por estado"></div>
    <div class="acciones"><span id="resumen"></span><button type="button" id="btn-recargar">↻ Actualizar</button></div>
    <div class="lista" id="lista"></div>
    </section>
    <section id="sec-reclamos" role="tabpanel" aria-labelledby="tab-reclamos" hidden>
      <p class="acciones">Libro de Reclamaciones: responde cada hoja en 15 días hábiles como máximo (lo exige INDECOPI).</p>
      <div class="lista" id="lista-reclamos"></div>
    </section>
  </main>
</div>

<dialog id="dlg-clave">
  <form id="form-clave">
    <h2>Cambiar contraseña</h2>
    <label>Contraseña actual<input id="c-actual" type="password" autocomplete="current-password" required></label>
    <label>Nueva contraseña (mínimo 10 caracteres)<input id="c-nueva" type="password" autocomplete="new-password" minlength="10" required></label>
    <p class="error" id="c-error" role="alert"></p>
    <div class="fila-botones">
      <button class="btn btn-gris" type="button" id="c-cancelar">Cancelar</button>
      <button class="btn btn-principal" type="submit">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-respuesta">
  <form id="form-respuesta">
    <h2>Respuesta <span id="r-numero"></span></h2>
    <label>Qué se le respondió al cliente y qué acciones se tomaron
      <textarea id="r-texto" rows="7" maxlength="3000" required></textarea></label>
    <p class="error" id="r-error" role="alert"></p>
    <div class="fila-botones">
      <button class="btn btn-gris" type="button" id="r-cancelar">Cancelar</button>
      <button class="btn btn-principal" type="submit">Guardar</button>
    </div>
  </form>
</dialog>

<div class="aviso" id="aviso" role="status" hidden></div>

<script src="panel.js"></script>
</body>
</html>
